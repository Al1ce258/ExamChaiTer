[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "examchaiter"
version = "0.1.0"
description = "Windows exam-window capture, OCR, LLM answering, and optional TTS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pywin32>=306",
    "mss>=9.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.3",
    "openai>=1.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyttsx3>=2.90",
    "pynput>=1.7",
    "PySide6>=6.7",
    "loguru>=0.7",
]

[project.scripts]
examchaiter = "examchaiter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.11",
    "PyInstaller>=6.10",
    "types-pywin32>=306",
]

[tool.hatch.build.targets.wheel]
packages = ["src/examchaiter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["examchaiter"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -m \"not e2e and not integration and not slow\" --strict-markers --cov=examchaiter --cov-report=term-missing"
filterwarnings = ["ignore::ResourceWarning"]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require external services",
    "integration: tests that require local operating-system resources",
    "slow: tests that are intentionally slow",
]

[tool.coverage.run]
branch = true
source = ["src/examchaiter"]
omit = [
    "tests/*",
    "scripts/*",
    "src/examchaiter/gui/main_window.py",
    "src/examchaiter/gui/tray.py",
    "src/examchaiter/gui/overlay.py",
    "src/examchaiter/gui/style.py",
    "src/examchaiter/gui/config_dialog.py",
    "src/examchaiter/gui/history_dialog.py",
    "src/examchaiter/gui/autopilot_bridge.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
